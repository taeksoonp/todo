<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>할 일</h1>

    <form id="add-form" class="add-form">
      <input id="text-input" type="text" placeholder="무엇을 해야 하나요?" autocomplete="off" required>
      <input id="due-input" type="date" aria-label="마감일">
      <select id="priority-input" aria-label="우선순위">
        <option value="high">높음</option>
        <option value="medium" selected>보통</option>
        <option value="low">낮음</option>
      </select>
      <button type="submit">추가</button>
    </form>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>할 일이 없습니다.</p>

    <footer class="footer">
      <span id="count"></span>
      <div class="filters" id="filters">
        <button data-filter="all" class="active">전체</button>
        <button data-filter="active">진행중</button>
        <button data-filter="done">완료</button>
      </div>
      <button id="clear-done" class="link">완료 항목 삭제</button>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
